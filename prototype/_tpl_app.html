<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漫剧工场 · 人的一生 · 制作台</title>
<style>
:root{
  --canvas:#f5f5f7; --panel:#fff; --panel-2:#fafafc; --line:#d2d2d7; --line-soft:#e8e8ed;
  --ink:#1d1d1f; --ink-2:#6e6e73; --ink-3:#86868b;
  --blue:#0071e3; --blue-hover:#0077ed; --blue-soft:#e8f1fd;
  --ok:#248a3d; --ok-soft:#e8f5ea; --warn:#b25000; --warn-soft:#fdf3e6; --danger:#d70015; --danger-soft:#fdeaea;
  --r:12px; --r-media:18px;
  --font:"SF Pro Text","SF Pro Display",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
[data-theme="dark"]{
  --canvas:#1c1c1e; --panel:#252527; --panel-2:#2c2c2e; --line:#424245; --line-soft:#3a3a3c;
  --ink:#f5f5f7; --ink-2:#a1a1a6; --ink-3:#86868b;
  --blue:#2997ff; --blue-hover:#47a6ff; --blue-soft:#12233a;
  --ok:#40c463; --ok-soft:#12291a; --warn:#e8934a; --warn-soft:#2d2214; --danger:#ff6961; --danger-soft:#2e1717;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--canvas);color:var(--ink);font-size:13px;line-height:1.47;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:13px;color:inherit;background:none;border:none;cursor:pointer}
input{font-family:inherit}
img{display:block}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(120,120,128,.4);border-radius:8px}
/* 顶栏 */
.topbar{height:48px;display:flex;align-items:center;gap:14px;padding:0 16px;background:rgba(251,251,253,.78);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line-soft);position:sticky;top:0;z-index:30}
[data-theme="dark"] .topbar{background:rgba(30,30,32,.78)}
.brand{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;letter-spacing:-.01em}
.brand-mark{width:20px;height:20px;border-radius:5px;background:var(--ink);color:var(--panel);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.crumb{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.crumb b{color:var(--ink);font-weight:500}
.seg{display:flex;background:rgba(120,120,128,.12);border-radius:8px;padding:2px}
.seg button{padding:4px 13px;border-radius:6px;font-size:12.5px}
.seg button.on{background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:500}
.topbar-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.balance{font-size:12px;color:var(--ink-3)}
.balance b{color:var(--ink);font-variant-numeric:tabular-nums}
.icobtn{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.icobtn:hover{background:rgba(120,120,128,.14)}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--panel);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
/* 三栏 */
.bench{display:flex;height:calc(100vh - 48px)}
.side{width:228px;background:var(--canvas);border-right:1px solid var(--line-soft);padding:12px 10px;overflow-y:auto;flex-shrink:0}
.side-t{font-size:11px;font-weight:600;color:var(--ink-3);padding:6px 10px 8px}
.st{display:flex;gap:9px;padding:7px 10px;border-radius:8px;align-items:flex-start;cursor:pointer;margin-bottom:1px}
.st:hover{background:rgba(120,120,128,.08)}
.st .mk{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0;margin-top:1px;background:var(--panel);border:1px solid var(--line);color:var(--ink-3)}
.st .nm{font-size:13px}
.st .ds{font-size:11.5px;color:var(--ink-3)}
.st.done .mk{background:var(--ok);border-color:var(--ok);color:#fff}
.st.now{background:var(--panel);box-shadow:0 0 0 1px var(--line-soft)}
.st.now .mk{background:var(--blue);border-color:var(--blue);color:#fff}
.st.now .nm{font-weight:600}
.st.todo .nm{color:var(--ink-2)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.stream{flex:1;overflow-y:auto;padding:22px 26px}
.who{display:flex;gap:10px;margin-bottom:14px}
.who .av{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--panel);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;flex-shrink:0}
.who .av.me{background:rgba(120,120,128,.2);color:var(--ink-2)}
.card{background:var(--panel);border-radius:var(--r);box-shadow:0 0 0 1px var(--line-soft);overflow:hidden;flex:1;max-width:680px}
.card-hd{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line-soft);font-weight:600;font-size:13.5px}
.card-hd .pill{margin-left:auto;font-size:11.5px;font-weight:500;padding:2px 9px;border-radius:980px}
.p-wait{background:var(--warn-soft);color:var(--warn)}
.p-info{background:var(--blue-soft);color:var(--blue)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-off{background:rgba(120,120,128,.14);color:var(--ink-2)}
.card-bd{padding:16px}
.card-bd p{font-size:13px;color:var(--ink-2)}
.card-bd p+p{margin-top:10px}
.card-bd b{color:var(--ink);font-weight:600}
.script p{font-size:13.5px;line-height:1.75;color:var(--ink)}
.script p+p{margin-top:12px}
.hl{background:var(--blue-soft);color:var(--blue);padding:1px 5px;border-radius:4px;font-weight:500}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 16px;border-radius:980px;font-size:13px;transition:background .18s,box-shadow .18s}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn-p{background:var(--blue);color:#fff}
.btn-p:hover{background:var(--blue-hover)}
.btn-s{background:var(--panel);box-shadow:0 0 0 1px var(--line)}
.btn-s:hover{box-shadow:0 0 0 1px var(--ink-3)}
.btn-t{color:var(--blue);height:28px;padding:0 8px}
.btn-t:hover{text-decoration:underline}
.btn:disabled{opacity:.4;cursor:not-allowed}
.note{font-size:12.5px;color:var(--ink-2);background:var(--panel-2);border-radius:10px;padding:10px 12px;margin-top:14px}
.note.w{background:var(--warn-soft);color:var(--warn)}
/* 剧本集数 */
.ep{border-bottom:1px solid var(--line-soft);padding:12px 0;display:flex;gap:12px;align-items:flex-start}
.ep:last-child{border-bottom:none}
.ep .no{font-size:11px;color:var(--ink-3);width:44px;flex-shrink:0;padding-top:2px}
.ep h5{font-size:13.5px;font-weight:600}
.ep .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11px;padding:2px 8px;border-radius:980px;background:var(--blue-soft);color:var(--blue)}
/* 角色卡 */
.rolegrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:4px}
.role{position:relative;border-radius:10px;overflow:hidden;cursor:pointer;box-shadow:0 0 0 1px var(--line-soft)}
.role img{width:100%;aspect-ratio:3/4;object-fit:cover}
.role .lab{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 7px;background:linear-gradient(to top,rgba(0,0,0,.72),rgba(0,0,0,0));color:#fff;font-size:11.5px;font-weight:600}
.role .chk{position:absolute;top:7px;right:7px;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.role.sel{box-shadow:0 0 0 2px var(--blue)}
.role.sel .chk{opacity:1}
.role .sw{position:absolute;top:7px;left:7px;font-size:10px;padding:2px 7px;border-radius:980px;background:rgba(0,0,0,.45);color:#fff;opacity:0;transition:opacity .15s}
.role:hover .sw{opacity:1}
/* 镜头表 */
.table{width:100%;border-collapse:collapse;font-size:12.5px}
.table th{text-align:left;font-weight:400;color:var(--ink-3);font-size:11.5px;padding:6px 8px;border-bottom:1px solid var(--line)}
.table td{padding:7px 8px;border-bottom:1px solid var(--line-soft);color:var(--ink-2);vertical-align:middle}
.table tr:last-child td{border-bottom:none}
.table .th2{width:52px}
.table img{width:46px;height:30px;object-fit:cover;border-radius:4px}
.table .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.chip{font-size:11px;padding:2px 8px;border-radius:980px;white-space:nowrap;font-weight:500}
.c-ok{background:var(--ok-soft);color:var(--ok)}
.c-run{background:var(--blue-soft);color:var(--blue)}
.c-wait{background:rgba(120,120,128,.14);color:var(--ink-2)}
.c-fail{background:var(--danger-soft);color:var(--danger)}
.c-key{background:#f3ecfd;color:#7a3fc9}
[data-theme="dark"] .c-key{background:#2b1f3d;color:#c9a8f5}
/* 进度 */
.progress{height:6px;border-radius:980px;background:rgba(120,120,128,.16);overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;background:var(--blue);border-radius:980px;transition:width .45s ease}
.big-num{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
/* 播放器 */
.player{border-radius:14px;overflow:hidden;position:relative;background:#000;aspect-ratio:9/16;max-width:220px;margin:0 auto}
.player img{width:100%;height:100%;object-fit:cover;opacity:.9}
.player .ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.15)}
.playbtn{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;color:#000}
.playbtn:hover{transform:scale(1.05)}
.ptime{position:absolute;left:10px;right:10px;bottom:8px;color:#fff;font-size:10.5px;display:flex;justify-content:space-between;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.pbar{position:absolute;left:10px;right:10px;bottom:26px;height:3px;border-radius:3px;background:rgba(255,255,255,.35)}
.pbar i{display:block;height:100%;background:#fff;border-radius:3px;width:0}
/* 右栏 */
.right{width:308px;background:var(--panel);border-left:1px solid var(--line-soft);display:flex;flex-direction:column;flex-shrink:0}
.rtabs{display:flex;gap:2px;padding:10px 12px;border-bottom:1px solid var(--line-soft)}
.rtabs button{padding:5px 11px;border-radius:980px;font-size:12.5px;color:var(--ink-2)}
.rtabs button.on{background:var(--blue-soft);color:var(--blue);font-weight:500}
.rbody{flex:1;overflow-y:auto;padding:6px 12px 16px}
.row{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px solid var(--line-soft)}
.row:last-child{border-bottom:none}
.row img{width:42px;height:28px;object-fit:cover;border-radius:4px}
.row .m{flex:1;min-width:0}
.row .t{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:11px;color:var(--ink-3)}
.metric{padding:10px 0;border-bottom:1px solid var(--line-soft)}
.metric .l{font-size:11.5px;color:var(--ink-2)}
.metric .v{font-size:16px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
/* 设置 */
.settings{padding:32px 36px;overflow-y:auto;height:calc(100vh - 48px);max-width:880px;margin:0 auto}
.settings h1{font-size:28px;font-weight:600;letter-spacing:-.021em}
.settings .lead{font-size:15px;color:var(--ink-2);margin-top:8px;max-width:640px;line-height:1.5}
.grp{margin-top:26px}
.grp-h{font-size:17px;font-weight:600;letter-spacing:-.012em;margin-bottom:10px;display:flex;align-items:baseline;gap:10px}
.grp-h span{font-size:12.5px;color:var(--ink-3);font-weight:400}
.ch{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;cursor:pointer;background:var(--panel);box-shadow:0 0 0 1px var(--line-soft);margin-bottom:8px}
.ch:hover{box-shadow:0 0 0 1px var(--ink-3)}
.ch.sel{box-shadow:0 0 0 2px var(--blue)}
.rad{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--line);flex-shrink:0}
.ch.sel .rad{border-color:var(--blue);background:var(--blue);box-shadow:inset 0 0 0 3px var(--panel)}
.ch .t{font-size:13.5px;font-weight:500}
.ch .d{font-size:12px;color:var(--ink-3)}
.ch .pr{margin-left:auto;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ch .pr.f{color:var(--ok)}
.keyrow{display:flex;gap:8px;margin:-4px 0 8px 38px}
.keyrow input{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:12.5px;background:var(--panel-2);color:var(--ink)}
.okline{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ok);margin:-4px 0 8px 38px}
/* 弹窗 */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:center;justify-content:center;z-index:60}
.ov.open{display:flex}
.modal{width:500px;background:var(--panel);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.32);overflow:hidden}
.modal-h{padding:18px 20px 6px;font-size:17px;font-weight:600;letter-spacing:-.012em}
.modal-b{padding:4px 20px 18px;font-size:13px;color:var(--ink-2);line-height:1.55}
.modal-b b{color:var(--ink)}
.modal-f{padding:12px 20px;background:var(--panel-2);display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(29,29,31,.94);color:#fff;padding:9px 18px;border-radius:980px;font-size:12.5px;display:none;z-index:70}
.toast.show{display:block}
.view{display:none}.view.on{display:block}
</style>
</head>
<body>
<h1 class="sr-only">漫剧工场制作台：人的一生，八步从剧本到导出</h1>
<header class="topbar">
  <div class="brand"><span class="brand-mark">漫</span>漫剧工场</div>
  <div class="crumb"><b>人的一生</b> · 第 1 集《院子里的下午》</div>
  <nav class="seg" aria-label="页面">
    <button class="on" data-act="view" data-arg="work">制作</button>
    <button data-act="view" data-arg="settings">模型设置</button>
  </nav>
  <div class="topbar-r">
    <div class="balance">平台余额 <b>86.4</b> 元</div>
    <button class="icobtn" data-act="theme" aria-label="切换深色模式" id="themeBtn"></button>
    <div class="avatar">林</div>
  </div>
</header>
<main id="v-work" class="view on">
<div class="bench">
  <aside class="side" id="side" aria-label="制作步骤"></aside>
  <section class="main" aria-label="工作区">
    <div class="stream" id="stream"></div>
    <div class="composer" style="display:flex;gap:8px;padding:12px 26px;border-top:1px solid var(--line-soft);background:var(--panel)">
      <input id="msg" placeholder="用平常说话的方式告诉助手，比如：第二集节奏太快了" style="flex:1;border:1px solid var(--line);border-radius:980px;padding:8px 14px;font-size:13px;background:var(--panel);color:var(--ink)" aria-label="给助手的留言">
      <button class="btn btn-p" data-act="say">发送</button>
    </div>
  </section>
  <aside class="right" aria-label="项目内容">
    <div class="rtabs" id="rtabs">
      <button class="on" data-act="tab" data-arg="shots">镜头</button>
      <button data-act="tab" data-arg="roles">角色</button>
      <button data-act="tab" data-arg="cost">花费</button>
    </div>
    <div class="rbody" id="rbody"></div>
  </aside>
</div>
</main>
<main id="v-settings" class="view">
<div class="settings">
  <h1>模型设置</h1>
  <p class="lead">每种能力都可以自己选：用平台额度（不用注册就能开始）、填上你自己的 API 密钥（更便宜），或者在你电脑上运行。密钥和素材都不会经过我们。</p>
  <div id="settingsBody"></div>
  <p class="lead" style="margin-top:22px;font-size:13px">没有设置的能力，在开始之前会明确告诉你，不会直接开始扣钱。</p>
</div>
</main>
<div class="ov" id="modal" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-h">确认角色形象？</div>
    <div class="modal-b">确认后，这 <b>5 个年龄</b>的形象会固定下来，用在 <b>12 个镜头</b>里。<br>以后想换，需要把已经做好的镜头重新生成一遍。</div>
    <div class="modal-f">
      <button class="btn btn-s" data-act="closeModal">再看看</button>
      <button class="btn btn-p" data-act="lockRoles">确认形象，继续</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const IMG={child:"{{CHILD}}",teen:"{{TEEN}}",adult:"{{ADULT}}",mid:"{{MID}}",old:"{{OLD}}",hero:"{{HERO}}"};
const sun='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg>';
const moon='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';
const STEPS=[
 {n:"写剧本", d:"3 集 · 8 个亮点"},
 {n:"确认剧本", d:"你确认后才继续"},
 {n:"角色形象", d:"5 个年龄"},
 {n:"确认角色形象", d:"必须你确认"},
 {n:"拆分镜头", d:"12 个镜头"},
 {n:"生成画面", d:"失败不计费"},
 {n:"看成片", d:"前 30 秒"},
 {n:"导出视频", d:"竖屏 MP4"}
];
const ROLES=[
 {k:"child", name:"八岁", img:IMG.child},
 {k:"teen", name:"十八岁", img:IMG.teen},
 {k:"adult", name:"二十八岁", img:IMG.adult},
 {k:"mid", name:"四十五岁", img:IMG.mid},
 {k:"old", name:"七十岁", img:IMG.old}
];
const SHOTS=[
 {i:1, t:"院子里 · 童年跑过", img:IMG.child, key:true, model:"可灵（你的密钥）", cost:16},
 {i:2, t:"晾衣绳 · 空镜", img:IMG.child, key:false, model:"海螺（平台额度）", cost:9},
 {i:3, t:"站台 · 少年回头", img:IMG.teen, key:true, model:"可灵（你的密钥）", cost:16},
 {i:4, t:"绿皮车 · 窗边", img:IMG.teen, key:false, model:"海螺（平台额度）", cost:9},
 {i:5, t:"写字楼 · 深夜加班", img:IMG.adult, key:true, model:"可灵（你的密钥）", cost:16},
 {i:6, t:"街边 · 一碗面", img:IMG.adult, key:false, model:"海螺（平台额度）", cost:9},
 {i:7, t:"医院 · 走廊长椅", img:IMG.mid, key:true, model:"可灵（你的密钥）", cost:16},
 {i:8, t:"病房 · 光", img:IMG.mid, key:false, model:"海螺（平台额度）", cost:9},
 {i:9, t:"老屋 · 门廊", img:IMG.hero, key:true, model:"可灵（你的密钥）", cost:16},
 {i:10, t:"公园 · 长椅", img:IMG.old, key:false, model:"海螺（平台额度）", cost:9},
 {i:11, t:"夕阳 · 大远景", img:IMG.old, key:false, model:"海螺（平台额度）", cost:9},
 {i:12, t:"背影 · 定格", img:IMG.old, key:true, model:"可灵（你的密钥）", cost:16}
];
const S={
  step:3, view:"work", tab:"shots", locked:false,
  sel:new Set(["child","teen","adult","mid","old"]),
  gen:{done:0, running:false, timer:null},
  player:{pos:0, playing:false, timer:null},
  exp:{state:"idle", pct:0},
  settings:{text:"local", image:"key", video:"key", voice:"local"},
  scriptVer:1
};
const $=s=>document.querySelector(s);

function act(a,arg){
  if(a==="goto"){ S.step=Math.max(0,Math.min(7,Number(arg))); render(); return; }
  if(a==="view"){ S.view=arg; $("#v-work").classList.toggle("on",arg==="work"); $("#v-settings").classList.toggle("on",arg==="settings");
    document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle("on",b.dataset.arg===arg)); return; }
  if(a==="tab"){ S.tab=arg; renderRight(); return; }
  if(a==="theme"){ const h=document.documentElement; const d=h.getAttribute("data-theme")==="dark";
    d?h.removeAttribute("data-theme"):h.setAttribute("data-theme","dark"); $("#themeBtn").innerHTML=d?moon:sun; return; }
  if(a==="regenScript"){ S.scriptVer++; render(); toast("已重写第 "+S.scriptVer+" 稿，剧本不产生视频费用"); return; }
  if(a==="confirmScript"){ S.step=1; render(); toast("第 1 稿已确认，再看一眼三集大纲"); return; }
  if(a==="confirmOutline"){ S.step=2; render(); toast("剧本已确认，下一步定角色"); return; }
  if(a==="sayHint"){ $("#msg").focus(); toast("在下面输入框告诉它哪里不对"); return; }
  if(a==="pickRole"){ S.sel.has(arg)?S.sel.delete(arg):S.sel.add(arg); render(); return; }
  if(a==="swapRole"){ toast("已为「"+arg+"」换了一张参考图（不额外收费）"); return; }
  if(a==="regenRoles"){ toast("已重新生成 5 组参考图，本次不额外收费"); return; }
  if(a==="confirmRoles"){ if(!S.sel.size){ toast("至少选一个角色"); return; } S.step=3; render(); toast("已选 "+S.sel.size+" 个角色"); return; }
  if(a==="askLock"){ $("#modal").classList.add("open"); return; }
  if(a==="closeModal"){ $("#modal").classList.remove("open"); return; }
  if(a==="lockRoles"){ $("#modal").classList.remove("open"); S.locked=true; S.step=4; render(); toast("5 个形象已确认，正在拆分镜头"); return; }
  if(a==="startGen"){ S.step=5; S.gen.running=true; render(); startGen(); toast("开始生成，失败的会自动换一家重试"); return; }
  if(a==="toggleGen"){ S.gen.running=!S.gen.running; if(S.gen.running)startGen(); render(); toast(S.gen.running?"继续生成":"已暂停，进度已保存"); return; }
  if(a==="retryShot"){ toast("已重新排队，失败的任务不收费"); return; }
  if(a==="finishGen"){ S.gen.done=12; S.gen.running=false; clearInterval(S.gen.timer); render(); toast("12 个镜头全部完成"); return; }
  if(a==="replayAll"){ S.step=6; render(); toast("整集重播"); return; }
  if(a==="play"){ togglePlay(); return; }
  if(a==="redoShot"){ toast("正在只重做这一段，其他镜头不动"); return; }
  if(a==="pickRatio"){ S.ratio=arg; document.querySelectorAll('[data-act="pickRatio"]').forEach(x=>x.classList.toggle("sel",x.dataset.arg===arg)); return; }
  if(a==="doExport"){ runExport(); return; }
  if(a==="download"){ toast("已保存到「人的一生 / 导出」文件夹"); return; }
  if(a==="pickModel"){ const [g,v]=arg.split(":"); S.settings[g]=v; renderSettings(); return; }
  if(a==="testKey"){ toast("连接测试通过：可以用，延迟 320ms"); return; }
  if(a==="saveSettings"){ toast("设置已保存（密钥加密存在本机）"); return; }
  if(a==="say"){ const v=$("#msg").value.trim(); if(!v){ toast("先说点什么，比如：第二集太快了"); return; }
    $("#msg").value=""; toast("收到：" + v + "。助手会按这句话调整下一稿"); return; }

  S.gen.timer=setInterval(()=>{
    if(!S.gen.running) return;
    if(S.gen.done>=12){ clearInterval(S.gen.timer); S.gen.running=false; render(); toast("12 个镜头全部完成，可以看成片了"); return; }
    S.gen.done++; render();
  },900);
}
function togglePlay(){
  const p=S.player;
  if(p.playing){ clearInterval(p.timer); p.playing=false; renderStream(); return; }
  p.playing=true;
  clearInterval(p.timer);
  p.timer=setInterval(()=>{
    p.pos+=0.5;
    if(p.pos>=30){ p.pos=30; clearInterval(p.timer); p.playing=false; renderStream(); toast("这一段播完了"); return; }
    renderStream();
  },120);
  renderStream();
}
function runExport(){
  S.exp={state:"running",pct:0};
  renderStream();
  const t=setInterval(()=>{
    S.exp.pct+=8;
    if(S.exp.pct>=100){ S.exp.pct=100; S.exp.state="done"; clearInterval(t); renderStream(); toast("导出完成，可以下载了"); return; }
    renderStream();
  },180);
}
let toastTimer;
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2600);
}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");
  if(!el) return;
  if(el.dataset.act==="swapRole"){ e.stopPropagation(); }
  act(el.dataset.act,el.dataset.arg);
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") $("#modal").classList.remove("open");
  if(e.key==="Enter" && document.activeElement.id==="msg") act("say");
  if((e.key==="Enter"||e.key===" ") && document.activeElement && document.activeElement.dataset && document.activeElement.dataset.act){
    e.preventDefault();
    act(document.activeElement.dataset.act, document.activeElement.dataset.arg);
  }
});
/* 侧栏步骤支持键盘：Enter / 空格 */
document.addEventListener("keydown",e=>{
  const el=document.activeElement;
  if(el && el.classList && el.classList.contains("st") && (e.key==="Enter"||e.key===" ")){
    e.preventDefault(); act("goto", el.dataset.arg);
  }
});
$("#themeBtn").innerHTML=(document.documentElement.getAttribute("data-theme")==="dark")?sun:moon;
render();
</script>
</body>
