name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: 引擎测试（Python ${{ matrix.py }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        py: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - name: 安装依赖
        run: pip install -r engine/requirements.txt
      - name: 全量测试（隔离数据目录，不污染真实库）
        run: python -m pytest engine/tests -q

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json
      - name: 安装依赖
        working-directory: desktop/web
        run: npm ci
      - name: 类型检查
        working-directory: desktop/web
        run: npx vue-tsc --noEmit
      - name: 构建
        working-directory: desktop/web
        run: npm run build
