name: Release（tag 触发，远端构建 Windows 安装包）

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: build (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python（引擎 + PyInstaller）
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: 引擎测试（142 用例）
        run: |
          python -m venv .venv
          .venv\Scripts\pip install -r engine/requirements.txt
          .venv\Scripts\python -m pytest engine/tests -q

      - name: 安装 PyInstaller
        run: .venv\Scripts\pip install pyinstaller

      - name: 前端类型检查与构建
        working-directory: desktop/web
        run: |
          npm ci
          npm run build

      - name: PyInstaller 打包引擎（sidecar）
        run: >
          .venv\Scripts\pyinstaller --noconfirm --clean
          --distpath desktop/src-tauri/resources/engine
          --workpath build/pyi
          --name whaleju-engine
          --add-data "engine/app/storage/schema.sql;engine/app/storage"
          engine/frozen_entry.py

      - name: Tauri 构建（NSIS + MSI）
        working-directory: desktop
        run: npx tauri build

      - name: 上传构建产物到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WhaleJu ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            desktop/src-tauri/target/**/bundle/**/*.exe
            desktop/src-tauri/target/**/bundle/**/*.msi
          fail_on_unmatched_files: false
